[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Test
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    contract: 契约测试 - 验证字段名和数据结构
    api: API 接口测试
    permission: 权限测试
    model: 模型测试
    integration: 集成测试
    slow: 慢速测试
