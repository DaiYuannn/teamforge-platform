  /api/v1/notifications/sse/:
    get:
      operationId: notifications_sse_retrieve
      description: |-
        Redis 事件唤醒 + 数据库游标补发。

        每条连接不再按固定间隔查询数据库；新通知由 Redis Pub/Sub 唤醒。
        断线重连时使用 last_id 做一次数据库补发，兼顾实时性与可靠性。
      parameters:
      - in: header
        name: Last-Event-ID
        schema:
          type: integer
        description: SSE 标准重连游标；last_id query 参数优先。
      - in: query
        name: format
        schema:
          type: string
          enum:
          - event-stream
          - json
      - in: query
        name: last_id
        schema:
          type: integer
        description: 最后收到的通知 ID，用于断线重连补发。
      tags:
      - notifications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: UTF-8 SSE 长连接。事件类型包括 connected、notification、notification_state、heartbeat、fallback
            和 stream_closed；每条事件的 data 行为 JSON 对象。
  /api/v1/notifications/unread_count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: |-
        获取当前用户未读通知数量
