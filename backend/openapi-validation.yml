        - list/retrieve: 所有认证用户可查看（任务完成情况对所有认证用户开放）
        - create/update/destroy: 项目负责人/老师/管理员
        - change_status: POST 修改任务状态
      parameters:
      - in: query
        name: assignee
        schema:
          type: integer
      - in: query
        name: creator
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          title: 优先级
          enum:
          - high
          - low
          - medium
          - urgent
        description: |-
          * `low` - 低
          * `medium` - 中
          * `high` - 高
          * `urgent` - 紧急
      - in: query
        name: project
        schema:
          type: integer
      - in: query
        name: reviewer
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: 任务状态
          enum:
          - cancelled
          - doing
          - done
          - need_help
          - overdue
          - paused
          - pending_review
          - todo
        description: |-
          * `todo` - 待办
          * `doing` - 进行中
          * `pending_review` - 待审核
          * `done` - 已完成
          * `overdue` - 已逾期
          * `paused` - 暂停
          * `cancelled` - 已取消
          * `need_help` - 需要帮助
      tags:
      - tasks
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskListList'
          description: ''
