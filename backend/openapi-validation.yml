      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalReviewRequest'
          multipart/form-data:
