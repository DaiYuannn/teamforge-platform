        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalReview'
          description: ''
  /api/v1/approvals/requests/my_requests/:
    get:
      operationId: approvals_requests_my_requests_retrieve
      description: 我的申请
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/v1/audit/operation-logs/:
    get:
      operationId: audit_operation_logs_list
      description: 操作日志列表
      parameters:
      - in: query
        name: is_success
        schema:
          type: boolean
      - in: query
        name: module
        schema:
          type: string
      - in: query
        name: operation_type
        schema:
          type: string
          title: 操作类型
          enum:
          - approve
          - create
          - delete
          - download
          - export
          - import
          - login
          - logout
          - other
          - reject
          - review
          - update
          - upload
          - view_sensitive
        description: |-
          * `create` - 创建
          * `update` - 更新
          * `delete` - 删除
          * `login` - 登录
          * `logout` - 登出
          * `export` - 导出
          * `import` - 导入
          * `upload` - 上传
          * `download` - 下载
          * `approve` - 审批
          * `reject` - 驳回
          * `review` - 审核
          * `view_sensitive` - 查看敏感
          * `other` - 其他
      - in: query
        name: operator
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOperationLogListList'
          description: ''
  /api/v1/audit/operation-logs/{id}/:
    get:
      operationId: audit_operation_logs_retrieve
      description: 操作日志详情
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 操作日志.
        required: true
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLog'
          description: ''
  /api/v1/audit/operation-logs/export/:
    get:
      operationId: audit_operation_logs_export_retrieve
      description: |-
        导出操作日志为 Excel（应用与 list 相同的筛选条件）
        GET /api/v1/audit/operation-logs/export/
        查询参数: search, module, operator, operation_type, start_date, end_date
        返回: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLog'
          description: ''
  /api/v1/audit/operation-logs/module_stats/:
    get:
      operationId: audit_operation_logs_module_stats_retrieve
      description: |-
        按模块统计操作数
        GET /api/v1/audit/logs/module_stats/
        可选参数: days（统计最近 N 天的数据，默认 30）
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLog'
          description: ''
  /api/v1/audit/operation-logs/recent/:
    get:
      operationId: audit_operation_logs_recent_retrieve
      description: |-
        最近 N 条操作日志
        GET /api/v1/audit/logs/recent/
        可选参数: limit（条数，默认 20，最大 100）
      tags:
      - audit
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLog'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        登录视图
        - POST: 邮箱+密码登录，返回 token + 用户信息
        - 记录登录尝试，IP 连续失败自动封禁
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveMemberTokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveMemberTokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActiveMemberTokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveMemberTokenRefresh'
          description: ''
  /api/v1/common/accessibility/report/:
    get:
      operationId: common_accessibility_report_retrieve
      description: |-
        API 无障碍 / 可访问性报告
