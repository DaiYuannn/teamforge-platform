      description: |-
        成员工作量视图
        GET /api/v1/users/workload/
        返回每个成员的任务数、预估工时、项目数
        预估工时根据任务优先级估算：urgent=16h, high=8h, medium=4h, low=2h
        支持按 user 筛选单个成员
      parameters:
      - in: query
        name: user
        schema:
          type: integer
        description: 按成员 ID 筛选。
      tags:
      - users
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberWorkloadResponse'
          description: ''
