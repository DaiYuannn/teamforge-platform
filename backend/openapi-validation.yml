    get:
      operationId: common_media_retrieve
      description: |-
        通过签名 URL 读取非公开媒体。

        签名 URL 只会在已通过各业务接口权限检查的序列化响应中生成；访问时再
        校验签名和有效期。这样 img 等原生浏览器请求无需暴露 JWT，也不能通过
        猜测 /media/ 路径绕过权限。
      parameters:
      - in: query
        name: download
        schema:
          type: boolean
        description: Return an attachment when true.
      - in: query
        name: token
        schema:
          type: string
        description: Time-limited signed media token.
        required: true
      tags:
      - common
      security:
      - {}
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: Protected media bytes; Content-Type reflects the stored file.
        '404':
          description: Token invalid, expired, or file missing.
