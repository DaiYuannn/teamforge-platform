        - destroy: 老师/管理员
        - transition: POST 状态流转
        - archive: POST 成果归档
        - sync_contribution: POST 同步贡献
        - my_todo: GET 待我处理
      parameters:
      - in: query
        name: applicant_executor
        schema:
          type: integer
      - in: query
        name: ip_type
        schema:
          type: string
          title: 成果类型
          enum:
          - design_patent
          - invention_patent
          - other
          - paper
          - software_copyright
          - utility_model
        description: |-
          * `software_copyright` - 软件著作权
          * `invention_patent` - 发明专利
          * `utility_model` - 实用新型专利
          * `design_patent` - 外观设计专利
          * `paper` - 论文成果
          * `other` - 其他
      - in: query
        name: main_writer
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: related_project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: 当前状态
          enum:
          - accepted
          - archived
          - authorized
          - deferred
          - draft
          - leader_review
          - modifying
          - paused
          - research_office_review
          - resubmitted
          - returned
          - teacher_confirm
          - terminated
          - writing
        description: |-
          * `draft` - 准备中
          * `writing` - 材料撰写中
          * `leader_review` - 项目负责人审核中
          * `teacher_confirm` - 老师确认中
          * `research_office_review` - 科研处审核中
          * `returned` - 科研处退回修改
          * `modifying` - 修改中
          * `resubmitted` - 已重新提交
          * `accepted` - 已受理
          * `authorized` - 已授权/已登记
          * `archived` - 已归档
          * `paused` - 暂停申请
          * `terminated` - 终止申请
          * `deferred` - 转为后续申请
      tags:
      - intellectual-property
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIPApplicationListList'
