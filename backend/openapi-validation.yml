  /api/v1/intellectual-property/applications/:
    get:
      operationId: intellectual_property_applications_list
      description: |-
        知识产权申请管理 ViewSet
        - list: 所有认证用户可查看（公开字段）
        - retrieve: 所有认证用户可查看（项目成员看完整字段，非成员看公开字段）
