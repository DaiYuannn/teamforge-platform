  /api/v1/common/backup/import/:
    post:
      operationId: common_backup_import_create
      tags:
      - common
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DemoBackupImportRequestRequest'
        required: true
      security:
      - bearerAuth: []
