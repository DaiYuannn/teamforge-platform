openapi: 3.0.3
info:
  title: TeamForge Platform API
  version: 2.1.0
  description: 团队项目管理平台公开的版本化 REST API 契约。
paths:
  /api/v1/activities/:
    get:
      operationId: activities_retrieve
      description: |-
        全局动态流
        GET /api/v1/activities/
        查询参数：
          - project: 按项目ID过滤
          - type:    按动态类型过滤
          - actor:   按操作人ID过滤
          - page / page_size: 分页
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/activities/project/{project_id}/:
    get:
      operationId: activities_project_retrieve
      description: |-
        项目动态流
        GET /api/v1/activities/project/<project_id>/
        查询参数：
          - type:  按动态类型过滤
          - actor: 按操作人ID过滤
          - page / page_size: 分页
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/approvals/flows/:
    get:
      operationId: approvals_flows_list
      description: 审批流程管理 ViewSet
      parameters:
      - in: query
        name: flow_type
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalFlowList'
          description: ''
    post:
      operationId: approvals_flows_create
      description: 审批流程管理 ViewSet
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalFlowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalFlowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalFlowRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalFlow'
          description: ''
  /api/v1/approvals/flows/{id}/:
    get:
      operationId: approvals_flows_retrieve
      description: 审批流程管理 ViewSet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批流程.
        required: true
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalFlow'
          description: ''
    put:
      operationId: approvals_flows_update
      description: 审批流程管理 ViewSet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批流程.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalFlowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalFlowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalFlowRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalFlow'
          description: ''
    patch:
      operationId: approvals_flows_partial_update
      description: 审批流程管理 ViewSet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批流程.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalFlowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalFlowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalFlowRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalFlow'
          description: ''
    delete:
      operationId: approvals_flows_destroy
      description: 审批流程管理 ViewSet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批流程.
        required: true
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals/requests/:
    get:
      operationId: approvals_requests_list
      description: |-
        审批申请管理 ViewSet
        - list: 当前用户查看自己的申请
        - create: 创建申请（applicant 自动设为当前用户）
        - approve: POST 审批通过
        - reject: POST 驳回
        - cancel: POST 取消
        - my_requests: GET 我的申请
      parameters:
      - in: query
        name: flow
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: 状态
          enum:
          - approved
          - cancelled
          - pending
          - rejected
        description: |-
          * `pending` - 待审批
          * `approved` - 已通过
          * `rejected` - 已驳回
          * `cancelled` - 已取消
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalRequestList'
          description: ''
    post:
      operationId: approvals_requests_create
      description: |-
        审批申请管理 ViewSet
        - list: 当前用户查看自己的申请
        - create: 创建申请（applicant 自动设为当前用户）
        - approve: POST 审批通过
        - reject: POST 驳回
        - cancel: POST 取消
        - my_requests: GET 我的申请
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequestCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestCreate'
          description: ''
  /api/v1/approvals/requests/{id}/:
    get:
      operationId: approvals_requests_retrieve
      description: |-
        审批申请管理 ViewSet
        - list: 当前用户查看自己的申请
        - create: 创建申请（applicant 自动设为当前用户）
        - approve: POST 审批通过
        - reject: POST 驳回
        - cancel: POST 取消
        - my_requests: GET 我的申请
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批申请.
        required: true
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
    put:
      operationId: approvals_requests_update
      description: |-
        审批申请管理 ViewSet
        - list: 当前用户查看自己的申请
        - create: 创建申请（applicant 自动设为当前用户）
        - approve: POST 审批通过
