        - cancel: POST 取消
        - my_requests: GET 我的申请
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批申请.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalRequestRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
    delete:
      operationId: approvals_requests_destroy
      description: |-
        审批申请管理 ViewSet
        - list: 当前用户查看自己的申请
        - create: 创建申请（applicant 自动设为当前用户）
        - approve: POST 审批通过
        - reject: POST 驳回
        - cancel: POST 取消
        - my_requests: GET 我的申请
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批申请.
        required: true
      tags:
      - approvals
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals/requests/{id}/approve/:
    post:
      operationId: approvals_requests_approve_create
      description: 审批通过
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批申请.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalReviewRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalReview'
          description: ''
  /api/v1/approvals/requests/{id}/cancel/:
    post:
      operationId: approvals_requests_cancel_create
      description: 取消申请
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批申请.
        required: true
      tags:
      - approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
          description: ''
  /api/v1/approvals/requests/{id}/reject/:
    post:
      operationId: approvals_requests_reject_create
      description: 驳回
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this 审批申请.
        required: true
      tags:
