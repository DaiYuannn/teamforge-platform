      parameters:
      - in: query
        name: created_by
        schema:
          type: integer
      - in: query
        name: module
        schema:
          type: string
          title: 导入模块
          enum:
          - competitions
          - finance
          - history_projects
          - ip_applications
          - members
          - projects
          - tasks
        description: |-
          * `projects` - 项目
          * `history_projects` - 历史项目
          * `members` - 成员
          * `competitions` - 比赛
          * `tasks` - 任务
          * `finance` - 经费
          * `ip_applications` - 知识产权
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: 导入状态
          enum:
          - confirmed
          - confirming
          - failed
          - pending
          - previewed
          - previewing
          - rolled_back
        description: |-
          * `pending` - 待处理
          * `previewing` - 预览中
          * `previewed` - 已预览
          * `confirming` - 确认中
          * `confirmed` - 已确认
          * `failed` - 失败
          * `rolled_back` - 已回滚
      tags:
      - imports
      security:
      - bearerAuth: []
