# ============================================================
# 团队管理平台 - 开发环境 Docker Compose
# 启动: docker compose up -d  (或运行 start-dev.sh / start-dev.ps1)
#
# 服务:
#   postgres  数据库 (5432)
#   redis     缓存/消息队列 (6379)
#   backend   Django runserver (8000)
#   frontend  Vite 开发服务器 (3000)
#   nginx     反向代理统一入口 (80)，代理 /api /admin 到后端，其余到前端
# ============================================================
version: "3.8"

services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: team_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: team_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Redis 缓存/消息队列 ----------
  redis:
    image: redis:7-alpine
    container_name: team_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Django 后端（开发模式 runserver）----------
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: dev
    container_name: team_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - env/backend.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      # 挂载源码以支持热重载（entrypoint 位于 /usr/local/bin，不受影响）
      - ../backend:/app
      - ../media:/app/media
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------- Vue 3 前端（开发模式 Vite HMR）----------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/dockerfiles/frontend.Dockerfile
      target: dev
    container_name: team_frontend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - env/frontend.env
    volumes:
      # 挂载源码以支持 HMR；匿名卷隔离 node_modules 防止被宿主覆盖
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  # ---------- Nginx 反向代理（开发环境统一入口）----------
  # 通过 http://localhost 访问，/api /admin /static /media 代理到后端，其余到前端 Vite
  nginx:
    image: nginx:alpine
    container_name: team_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  redis_data:
