# ============================================================
# 团队管理平台 - 生产环境 Docker Compose
# 推荐启动: bash start-prod.sh 或 .\start-prod.ps1
# 手动部署时必须通过 --env-file env/backend.prod.env 加载插值变量，
# 并在启动其余业务服务前执行 migrate 与 collectstatic。
#
# 服务:
#   postgres       数据库（不暴露端口）
#   redis          缓存/消息队列（不暴露端口）
#   backend        Django + gunicorn（初始化由生产部署脚本执行）
#   celery-worker  定时报表与异步任务执行器
#   celery-beat    定时报表调度器
#   frontend       前端构建器（构建 dist 输出到共享卷，完成后退出）
#   nginx          反向代理 + SPA 托管 (80/443)
# ============================================================
services:
  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: team_postgres_prod
    restart: unless-stopped
    # 生产环境不暴露数据库端口到宿主机
    env_file:
      - env/backend.prod.env
    environment:
      POSTGRES_DB: ${DB_NAME:-team_management}
      # Compose 命令通过 --env-file env/backend.prod.env 提供这些插值变量
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Redis 缓存/消息队列 ----------
  redis:
    image: redis:7-alpine
    container_name: team_redis_prod
    restart: unless-stopped
    # 生产环境不暴露 Redis 端口
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Django 后端（生产模式 gunicorn）----------
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: prod
    container_name: team_backend_prod
    restart: unless-stopped
    env_file:
      - env/backend.prod.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    # 生产环境使用镜像内构建产物，不挂载源码。
    # start-prod 脚本会在启动其余业务服务前执行 migrate 与 collectstatic。
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class gevent --worker-connections 256 --timeout 0 --graceful-timeout 30
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - demo_backup_data:/app/demo_backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: ../backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: prod
    container_name: team_celery_worker
    restart: unless-stopped
    env_file:
      - env/backend.prod.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - media_data:/app/media
    command: celery -A config worker -l info
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ---------- Celery Beat ----------
  celery-beat:
    build:
      context: ../backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: prod
    container_name: team_celery_beat
    restart: unless-stopped
    env_file:
      - env/backend.prod.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config beat -l info
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ---------- 前端构建器（构建 dist 并输出到共享卷）----------
  # 使用 build 阶段（已执行 npm run build），将 dist 拷贝到 frontend_dist 卷后退出
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/dockerfiles/frontend.Dockerfile
      target: build
    container_name: team_frontend_builder
    command: sh -c "cp -r /app/dist/. /dist/ && echo '前端构建产物已输出到共享卷'"
    volumes:
      - frontend_dist:/dist
    restart: "no"

  # ---------- Nginx 反向代理（统一入口，托管前端 + 代理后端）----------
  nginx:
    image: nginx:alpine
    container_name: team_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
  demo_backup_data:
  frontend_dist:
