# ============================================================
# Nginx 配置 - 生产环境
# 容器: team_nginx_prod (端口 80 / 443)
# 职责:
#   /api/ /admin/   -> 反向代理 backend:8000
#   /media/         -> alias /app/media/      (用户上传)
#   /static/        -> alias /app/staticfiles/(Django collectstatic)
#   /               -> root /usr/share/nginx/html (前端 SPA, try_files 支持 history 路由)
# ============================================================

# ---------- HTTP ----------
server {
    listen 80;
    server_name localhost;

    # 文件上传大小限制
    client_max_body_size 100m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Django REST API -> 后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django Admin -> 后端
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户上传的媒体文件
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django 收集的静态文件
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA（Vue 3 history 模式路由）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

