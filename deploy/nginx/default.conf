# ============================================================
# Nginx 配置 - 开发环境反向代理
# 容器: team_nginx_dev (端口 80)
# 代理规则:
#   /api/ /admin/ /static/ /media/  -> backend:8000 (Django)
#   其他                              -> frontend:3000 (Vite HMR)
# 通过 http://localhost 统一访问
# ============================================================
server {
    listen 80;
    server_name localhost;

    # 文件上传大小限制
    client_max_body_size 100m;

    # 媒体签名属于短期访问凭证，不写入开发代理访问日志。
    location = /api/v1/common/media/ {
        access_log off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 长连接：关闭代理缓冲，避免实时通知被聚合或在普通 API 超时后断开。
    location = /api/v1/notifications/sse/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Django REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin 后台
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 静态文件（开发模式由 runserver 提供）
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # 用户上传媒体文件
    location /media/ {
        proxy_pass http://backend:8000;
    }

    # 其他请求 -> Vite 开发服务器（含 WebSocket 支持 HMR 热更新）
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Vite HMR 必需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
