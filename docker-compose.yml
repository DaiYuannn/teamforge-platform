services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - docker_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - docker_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: prod
    restart: unless-stopped
    env_file:
      - .env.docker
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120
    volumes:
      - docker_media:/app/media
      - docker_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/auth/login/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  celery_worker:
    build:
      context: ./backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: prod
    restart: unless-stopped
    env_file:
      - .env.docker
    command: celery -A config worker -l info
    volumes:
      - docker_media:/app/media
      - docker_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: ../deploy/dockerfiles/backend.Dockerfile
      args:
        ENVIRONMENT: prod
    restart: unless-stopped
    env_file:
      - .env.docker
    command: celery -A config beat -l info
    volumes:
      - docker_media:/app/media
      - docker_static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/dockerfiles/frontend.Dockerfile
      target: build
    command: sh -c "rm -rf /dist/* && cp -r /app/dist/. /dist/"
    volumes:
      - docker_frontend_dist:/dist
    restart: "no"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - docker_frontend_dist:/usr/share/nginx/html:ro
      - docker_media:/app/media:ro
      - docker_static:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  docker_pg_data:
  docker_redis_data:
  docker_media:
  docker_static:
  docker_frontend_dist:
